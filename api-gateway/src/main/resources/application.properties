# Application
spring.application.name=api-gateway
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT
security.jwt.secret=${JWT_SECRET}

# CORS (list of allowed origins, comma-separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Service routes
services.income.url=${INCOME_SERVICE_URL}
services.expense.url=${EXPENSE_SERVICE_URL}
services.investment.url=${INVESTMENT_SERVICE_URL}
services.transaction.url=${TRANSACTION_SERVICE_URL}
services.user.url=${USER_SERVICE_URL}

# SpringDoc configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.security=INFO
logging.level.com.afarms.apigateway=INFO
