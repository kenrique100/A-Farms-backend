# Application
spring.application.name=api-gateway
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT
security.jwt.secret=${JWT_SECRET}

# CORS (list of allowed origins, comma-separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Service routes
services.income.url=${INCOME_SERVICE_URL:http://income-service:8080}
services.expense.url=${EXPENSE_SERVICE_URL:http://expense-service:8080}
services.investment.url=${INVESTMENT_SERVICE_URL:http://investment-service:8080}
services.transaction.url=${TRANSACTION_SERVICE_URL:http://transaction-service:8080}
services.user.url=${USER_SERVICE_URL:http://user-service:8080}

# SpringDoc OpenAPI
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.security=INFO
logging.level.com.afarms.apigateway=INFO
