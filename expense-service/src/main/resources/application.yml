spring:
  application:
    name: expense-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/expense_db}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:akentech}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:change_me}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt-secret: ${JWT_SECRET:INSECURE_LOCAL_DEV_ONLY_CHANGE_ME_JWT_SECRET}
  admin-key: ${ADMIN_KEY:INSECURE_LOCAL_DEV_ONLY_CHANGE_ME_ADMIN_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
