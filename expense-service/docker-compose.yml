services:
  expense-service:
    build: .
    container_name: expense-service
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://expense-service-db:5432/expense_db
      SPRING_DATASOURCE_USERNAME: ${AFARMS_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${AFARMS_DB_PASSWORD}
    depends_on:
      expense-service-db:
        condition: service_healthy
    networks:
      - dev-network

  expense-service-db:
    image: postgres:16-alpine
    container_name: expense-service-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: expense_db
      POSTGRES_USER: ${AFARMS_DB_USER}
      POSTGRES_PASSWORD: ${AFARMS_DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AFARMS_DB_USER} -d expense_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - expense-service-db-data:/var/lib/postgresql/data
    networks:
      - dev-network

networks:
  dev-network:
    external: true
    name: dev-network

volumes:
  expense-service-db-data:
