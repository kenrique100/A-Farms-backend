services:
  expense-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: ${SERVER_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://expense-service-db:5432/${EXPENSE_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TRANSACTION_SERVICE_URL: ${TRANSACTION_SERVICE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
    env_file:
      - .env
    depends_on:
      expense-service-db:
        condition: service_healthy
    networks:
      - dev-network
    restart: unless-stopped

  expense-service-db:
    image: postgres:16-alpine
    container_name: expense-service-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${EXPENSE_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${EXPENSE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - expense-service-db-data:/var/lib/postgresql/data
    networks:
      - dev-network
    restart: unless-stopped

networks:
  dev-network:
    external: true
    name: dev-network

volumes:
  expense-service-db-data: