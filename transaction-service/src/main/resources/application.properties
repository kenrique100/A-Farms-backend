spring.application.name=transaction-service
server.port=${SERVER_PORT}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT
security.jwt.secret=${JWT_SECRET}

# Downstream service URLs
services.income.url=${INCOME_SERVICE_URL}
services.expense.url=${EXPENSE_SERVICE_URL}
services.investment.url=${INVESTMENT_SERVICE_URL}

# Logging
logging.level.com.afarms.transaction=${LOG_LEVEL:INFO}
logging.level.io.github.resilience4j=${RESILIENCE4J_LOG_LEVEL:INFO}

# Profiles
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# Resilience4j — Income
resilience4j.circuitbreaker.instances.incomeService.sliding-window-size=10
resilience4j.circuitbreaker.instances.incomeService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.incomeService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.incomeService.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.incomeService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.incomeService.register-health-indicator=true
resilience4j.retry.instances.incomeServiceRetry.max-attempts=3
resilience4j.retry.instances.incomeServiceRetry.wait-duration=1000ms
resilience4j.retry.instances.incomeServiceRetry.enable-exponential-backoff=true
resilience4j.retry.instances.incomeServiceRetry.exponential-backoff-multiplier=2

# Resilience4j — Expense
resilience4j.circuitbreaker.instances.expenseService.sliding-window-size=10
resilience4j.circuitbreaker.instances.expenseService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.expenseService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.expenseService.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.expenseService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.expenseService.register-health-indicator=true
resilience4j.retry.instances.expenseServiceRetry.max-attempts=3
resilience4j.retry.instances.expenseServiceRetry.wait-duration=1000ms
resilience4j.retry.instances.expenseServiceRetry.enable-exponential-backoff=true
resilience4j.retry.instances.expenseServiceRetry.exponential-backoff-multiplier=2

# Resilience4j — Investment
resilience4j.circuitbreaker.instances.investmentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.investmentService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.investmentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.investmentService.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.investmentService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.investmentService.register-health-indicator=true
resilience4j.retry.instances.investmentServiceRetry.max-attempts=3
resilience4j.retry.instances.investmentServiceRetry.wait-duration=1000ms
resilience4j.retry.instances.investmentServiceRetry.enable-exponential-backoff=true
resilience4j.retry.instances.investmentServiceRetry.exponential-backoff-multiplier=2

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html