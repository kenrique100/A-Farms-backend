# Application
spring.application.name=transaction-service
server.port=${SERVER_PORT}

# Database Configuration - PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT Configuration
security.jwt.secret=${JWT_SECRET}

# Services URLs
services.income.url=${INCOME_SERVICE_URL}
services.user.url=${USER_SERVICE_URL}

# Logging Levels
logging.level.com.afarms.transaction=${LOG_LEVEL}
logging.level.io.github.resilience4j=${RESILIENCE4J_LOG_LEVEL}
logging.level.org.springframework.web.client=${REST_TEMPLATE_LOG_LEVEL}

# Spring Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Circuit Breaker for Income Service
resilience4j.circuitbreaker.instances.incomeService.register-health-indicator=true
resilience4j.circuitbreaker.instances.incomeService.sliding-window-size=10
resilience4j.circuitbreaker.instances.incomeService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.incomeService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.incomeService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.incomeService.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.incomeService.failure-rate-threshold=50

# Retry for Income Service
resilience4j.retry.instances.incomeServiceRetry.max-attempts=3
resilience4j.retry.instances.incomeServiceRetry.wait-duration=1000ms
resilience4j.retry.instances.incomeServiceRetry.exponential-backoff-multiplier=2
resilience4j.retry.instances.incomeServiceRetry.enable-exponential-backoff=true

# TimeLimiter for Income Service
resilience4j.timelimiter.instances.incomeService.timeout-duration=5000ms

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=always
management.endpoint.circuitbreakers.enabled=true
management.health.circuitbreakers.enabled=true

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html