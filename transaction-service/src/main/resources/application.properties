spring.application.name=transaction-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/transaction_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:akentech}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:change_me}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8084}

management.endpoints.web.exposure.include=health,info

services.user.url=${USER_SERVICE_URL:http://localhost:8085}

app.security.jwt-secret=${JWT_SECRET:INSECURE_LOCAL_DEV_ONLY_CHANGE_ME_JWT_SECRET}
app.admin-key=${ADMIN_KEY:INSECURE_LOCAL_DEV_ONLY_CHANGE_ME_ADMIN_KEY}
app.integration.transaction-api-key=${TRANSACTION_SERVICE_API_KEY:INSECURE_LOCAL_DEV_ONLY_CHANGE_ME_TRANSACTION_API_KEY}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
