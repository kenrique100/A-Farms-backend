spring.application.name=transaction-service
server.port=${SERVER_PORT}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# JWT Configuration
security.jwt.secret=${JWT_SECRET}

# Services URLs
services.user.url=${USER_SERVICE_URL}

# Internal API Key
app.integration.internal-api-key=${TRANSACTION_SERVICE_API_KEY}


# Transaction Service Circuit Breaker
resilience4j.circuitbreaker.instances.transactionService.register-health-indicator=true
resilience4j.circuitbreaker.instances.transactionService.sliding-window-size=10
resilience4j.circuitbreaker.instances.transactionService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.transactionService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.transactionService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.transactionService.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.transactionService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.transactionService.event-consumer-buffer-size=10

# User Service Circuit Breaker
resilience4j.circuitbreaker.instances.userServiceBreaker.register-health-indicator=true
resilience4j.circuitbreaker.instances.userServiceBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.userServiceBreaker.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.userServiceBreaker.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.userServiceBreaker.wait-duration-in-open-state=5000ms
resilience4j.circuitbreaker.instances.userServiceBreaker.failure-rate-threshold=60

# Transaction Service Retry
resilience4j.retry.instances.transactionRetry.max-attempts=3
resilience4j.retry.instances.transactionRetry.wait-duration=1000ms
resilience4j.retry.instances.transactionRetry.exponential-backoff-multiplier=2
resilience4j.retry.instances.transactionRetry.enable-exponential-backoff=true

# User Service Retry
resilience4j.retry.instances.userServiceRetry.max-attempts=2
resilience4j.retry.instances.userServiceRetry.wait-duration=500ms
resilience4j.retry.instances.userServiceRetry.exponential-backoff-multiplier=1.5
resilience4j.retry.instances.userServiceRetry.enable-exponential-backoff=true

# Resilience-4j TimeLimiter Configuration
resilience4j.timelimiter.instances.transactionService.timeout-duration=5000ms
resilience4j.timelimiter.instances.userServiceBreaker.timeout-duration=3000ms

# Actuator Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,retries
management.endpoint.health.show-details=always
management.endpoint.circuitbreakers.enabled=true
management.endpoint.retries.enabled=true
management.health.circuitbreakers.enabled=true

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging Configuration
logging.level.com.afarms.transaction=${LOG_LEVEL}
logging.level.io.github.resilience4j=${RESILIENCE4J_LOG_LEVEL}
logging.level.org.springframework.web.client=${REST_TEMPLATE_LOG_LEVEL}