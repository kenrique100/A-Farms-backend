services:
  transaction-service:
    build: .
    container_name: transaction-service
    ports:
      - "8084:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://transaction-service-db:5432/transaction_db
      SPRING_DATASOURCE_USERNAME: afarms
      SPRING_DATASOURCE_PASSWORD: afarms
    depends_on:
      - transaction-service-db
    networks:
      - dev-network

  transaction-service-db:
    image: postgres:16-alpine
    container_name: transaction-service-db
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: transaction_db
      POSTGRES_USER: afarms
      POSTGRES_PASSWORD: afarms
    volumes:
      - transaction-service-db-data:/var/lib/postgresql/data
    networks:
      - dev-network

networks:
  dev-network:
    external: true
    name: dev-network

volumes:
  transaction-service-db-data:
