services:
  transaction-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transaction-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: ${SERVER_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://transaction-service-db:5432/${TRANSACTION_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      TRANSACTION_SERVICE_API_KEY: ${TRANSACTION_SERVICE_API_KEY}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL}
      LOG_LEVEL: ${LOG_LEVEL}
      RESILIENCE4J_LOG_LEVEL: ${RESILIENCE4J_LOG_LEVEL}
      REST_TEMPLATE_LOG_LEVEL: ${REST_TEMPLATE_LOG_LEVEL}
    env_file:
      - .env
    depends_on:
      transaction-service-db:
        condition: service_healthy
    networks:
      - dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  transaction-service-db:
    image: postgres:16-alpine
    container_name: transaction-service-db
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: ${TRANSACTION_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${TRANSACTION_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - transaction-service-db-data:/var/lib/postgresql/data
    networks:
      - dev-network
    restart: unless-stopped

networks:
  dev-network:
    external: true
    name: dev-network

volumes:
  transaction-service-db-data: