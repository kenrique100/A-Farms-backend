spring.application.name=user-service
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://postgres-user:5432/userdb
spring.datasource.username=${USER_DB_USER}
spring.datasource.password=${USER_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

security.jwt.secret=${JWT_SECRET}

app.admin.email=${ADMIN_EMAIL}
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.admin-key=${ADMIN_KEY}

management.endpoints.web.exposure.include=health

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.afarms.user=INFO
logging.level.org.springframework.security=INFO
