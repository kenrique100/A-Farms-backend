spring.application.name=user-service
server.port=${SERVER_PORT:8085}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/user_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:akentech}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:INSECURE_LOCAL_DEV_CHANGE_ME}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

security.jwt.secret=${JWT_SECRET:INSECURE_LOCAL_DEV_ONLY_CHANGE_ME_JWT_SECRET}

app.admin-key=${ADMIN_KEY:INSECURE_LOCAL_DEV_ONLY_CHANGE_ME_ADMIN_KEY}
app.admin.email=${ADMIN_EMAIL:admin@afarms.local}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:INSECURE_LOCAL_DEV_CHANGE_ME}

management.endpoints.web.exposure.include=health,info

# SpringDoc configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=false
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true

logging.level.com.afarms.user=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=INFO
logging.level.org.springdoc.webmvc.api.OpenApiResource=DEBUG
