spring.application.name=user-service
server.port=${SERVER_PORT:8085}

spring.datasource.url=jdbc:postgresql://user-service-db:5432/${USER_DB_NAME}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

security.jwt.secret=${JWT_SECRET:dev-jwt-secret}

app.admin-key=${ADMIN_KEY}
app.admin.email=${ADMIN_EMAIL}
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}

management.endpoints.web.exposure.include=health,info

# SpringDoc configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=false
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true

logging.level.com.afarms.user=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=INFO
logging.level.org.springdoc.webmvc.api.OpenApiResource=DEBUG
