services:
  income-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: income-service
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://income-service-db:5432/${INCOME_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_KEY: ${ADMIN_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      income-service-db:
        condition: service_healthy
    networks:
      - dev-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  income-service-db:
    image: postgres:16-alpine
    container_name: income-service-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${INCOME_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${INCOME_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - income-service-db-data:/var/lib/postgresql/data
    networks:
      - dev-network
    restart: unless-stopped

networks:
  dev-network:
    external: true
    name: dev-network

volumes:
  income-service-db-data:
