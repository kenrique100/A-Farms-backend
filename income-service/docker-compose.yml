services:
  income-service:
    build: .
    container_name: income-service
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://income-service-db:5432/income_db
      SPRING_DATASOURCE_USERNAME: afarms
      SPRING_DATASOURCE_PASSWORD: afarms
    depends_on:
      - income-service-db
    networks:
      - dev-network

  income-service-db:
    image: postgres:16-alpine
    container_name: income-service-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: income_db
      POSTGRES_USER: afarms
      POSTGRES_PASSWORD: afarms
    volumes:
      - income-service-db-data:/var/lib/postgresql/data
    networks:
      - dev-network

networks:
  dev-network:
    external: true
    name: dev-network

volumes:
  income-service-db-data:
