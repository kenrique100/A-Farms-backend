spring.application.name=income-service
server.port=${SERVER_PORT}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security
security.jwt.secret=${JWT_SECRET}

# Service URLs
services.user.url=${USER_SERVICE_URL}
services.transaction.url=${TRANSACTION_SERVICE_URL}
app.integration.transaction-api-key=${TRANSACTION_SERVICE_API_KEY}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.farmstack.income=${LOG_LEVEL}