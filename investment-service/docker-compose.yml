services:
  investment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: investment-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: ${SERVER_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://investment-service-db:5432/${INVESTMENT_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICES_USER_URL: ${SERVICES_USER_URL}
    env_file:
      - .env
    depends_on:
      investment-service-db:
        condition: service_healthy
    networks:
      - dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  investment-service-db:
    image: postgres:16-alpine
    container_name: investment-service-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: ${INVESTMENT_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${INVESTMENT_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - investment-service-db-data:/var/lib/postgresql/data
    networks:
      - dev-network
    restart: unless-stopped

networks:
  dev-network:
    external: true
    name: dev-network

volumes:
  investment-service-db-data: