spring:
  application:
    name: investment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/investment_db}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:akentech}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:change_me}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    secret: ${JWT_SECRET}

services:
  transaction:
    url: ${TRANSACTION_SERVICE_URL:http://localhost:8084}

resilience4j:
  circuitbreaker:
    instances:
      transactionService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
  retry:
    instances:
      transactionServiceRetry:
        max-attempts: 3
        wait-duration: 1s
